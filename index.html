<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牛津阅读树 · 点读绘本</title>
<style>
:root{--green:#1d7a4f;--green-d:#166b42;--amber:#d97706;--ink:#20312a;--paper:#fdf6e3;--card:#fffdf7;--line:#e5dcc3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3ecd9;color:var(--ink);overflow:hidden}
.wrap{display:flex;height:100dvh;width:100%}
button{font-family:inherit;cursor:pointer}
svg.ic{display:block;flex:none}
/* shelf (desktop) */
.shelf{width:208px;flex:none;background:#fbf7ea;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:margin .25s}
.shelf-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;font-weight:700}
.shelf-head button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.shelf-list{overflow-y:auto;padding:4px 8px 12px;display:flex;flex-direction:column;gap:8px}
.shelf-item{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid transparent;background:#fff;border-radius:12px;padding:8px;width:100%;transition:transform .15s ease,border-color .15s ease,background .15s ease}
.shelf-item:active{transform:scale(.97)}
.shelf-item.on{border-color:var(--green);background:#eef7f0}
.shelf-item img{width:40px;height:49px;object-fit:cover;border-radius:6px;flex:none}
.shelf-item .t{font-weight:700;font-size:14px;line-height:1.25}
.shelf-item>span{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.shelf-item .s{display:inline-block;font-size:11px;font-weight:600;color:var(--green-d);background:#e3f2e7;border-radius:999px;padding:2px 7px;margin-top:3px;white-space:nowrap}
.shelf-item.on .s{background:var(--green);color:#fff}
.shelf-search{padding:0 12px 8px}
.shelf-search input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
.shelf-search input:focus{border-color:var(--green)}
body.shelf-closed .shelf{margin-left:-208px}
.shelf-open-btn{display:none;position:fixed;left:10px;top:10px;z-index:30;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);align-items:center;gap:6px;color:var(--ink)}
body.shelf-closed .shelf-open-btn{display:flex}
/* main */
.main{flex:1;display:flex;min-width:0}
.img-wrap{flex:1;position:relative;background:var(--paper);display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.img-wrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.load-veil{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .25s ease}
.load-veil.show{opacity:1;pointer-events:auto}
.load-veil img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:blur(7px);opacity:.5}
.veil-box{position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 22px}
.veil-spin{width:34px;height:34px;border-radius:50%;border:4px solid #e5dcc3;border-top-color:var(--green);animation:vspin .8s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.veil-title{font-weight:700;font-size:18px;margin-top:13px;text-align:center}
.veil-sub{color:#7a7263;font-size:14px;margin-top:4px}
.load-veil.error{cursor:pointer}
.load-veil.error .veil-spin{display:none}
.load-veil.error .veil-sub{color:var(--green-d);font-weight:700}
.page-badge{position:absolute;top:12px;right:12px;background:rgba(32,49,42,.82);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.fab{display:none}
.panel{width:344px;flex:none;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;gap:12px;min-height:0;transition:opacity .25s ease}
.main.loading .panel{opacity:.45;pointer-events:none}
.tag{align-self:flex-start;background:#e3f2e7;color:var(--green-d);font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.panel h1{font-size:27px;line-height:1.25;margin-top:8px}
.zh{color:#54604f;font-size:16px;font-weight:600;margin-top:3px;line-height:1.4}
.sentences{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.sent{display:flex;align-items:center;gap:10px;text-align:left;background:#fdf6de;border:1.5px solid #ead9ae;border-radius:14px;padding:14px;font-size:19px;font-weight:600;line-height:1.35;color:var(--ink)}
.sent .sp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.sent.playing{background:#dff2e4;border-color:var(--green)}
.pager{display:flex;gap:10px}
.pager button{flex:1;padding:13px;border-radius:12px;border:1.5px solid #d8cdb0;background:#fff8e6;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink)}
.pager button:disabled{opacity:.38;cursor:default}
.pager-num{display:none}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;accent-color:var(--green);height:28px}
.slider-num{font-weight:700;white-space:nowrap}
.read-row{display:flex;align-items:center;gap:12px}
.full-btn{background:#fff;color:var(--green-d);border:1.5px solid var(--green);border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.full-btn.stop{background:var(--amber);border-color:var(--amber);color:#fff}
.auto-wrap{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.switch{position:relative;width:48px;height:27px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.switch .tr{position:absolute;inset:0;background:#cfc7ab;border-radius:999px;transition:.2s}
.switch .tr:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .tr{background:var(--green)}
.switch input:checked + .tr:after{left:24px}
.speed.loop{grid-template-columns:repeat(3,1fr)}
.sec-title{font-weight:700;font-size:15px}
.speed{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.speed button{border:1.5px solid #d8cdb0;background:#fff;border-radius:10px;padding:8px 2px;font-size:13px;font-weight:700}
.speed button small{display:block;font-weight:500;color:#7a7263;font-size:11px}
.speed button.on{background:var(--green);color:#fff;border-color:var(--green)}
.speed button.on small{color:#d9ecdf}
.util-wrap{position:relative}
.util-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.speed-chip{display:flex;align-items:center;gap:7px;border:1.5px solid #d8cdb0;background:#fff;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;color:var(--ink)}
.speed-chip.on{border-color:var(--green);background:#eef7f0;color:var(--green-d)}
.gear-btn{width:42px;height:42px;border:1.5px solid #d8cdb0;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.gear-btn.on{border-color:var(--green);background:#eef7f0;color:var(--green-d)}
.pop{position:absolute;bottom:calc(100% + 10px);background:#fff;border:1.5px solid var(--green);border-radius:14px;box-shadow:0 8px 24px rgba(60,45,20,.16);opacity:0;pointer-events:none;transform:translateY(4px);transition:.18s;z-index:20}
.pop.show{opacity:1;pointer-events:auto;transform:none}
.speed-pop{left:0;min-width:132px;padding:6px;display:flex;flex-direction:column}
.speed-pop button{border:none;background:none;padding:10px 14px;font-size:15.5px;font-weight:600;border-radius:9px;text-align:center;color:var(--ink);font-family:inherit;cursor:pointer}
.speed-pop button.on{background:#e3f2e7;color:var(--green-d);font-weight:700}
.set-pop{right:0;width:264px;padding:8px 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.set-row .tx b{display:block;font-size:15px}
.set-row .tx span{font-size:12.5px;color:#7a7263}
.set-div{height:1px;background:var(--line);margin:3px 0}
.chain-chips{display:none;gap:8px;margin:6px 0 8px}
.chain-chips.show{display:flex}
.chain-chips button{flex:1;padding:9px;border-radius:10px;border:1.5px solid #d8cdb0;background:#fff;font-size:14.5px;font-weight:700;color:var(--ink);font-family:inherit;cursor:pointer}
.chain-chips button.on{background:var(--green);border-color:var(--green);color:#fff}
.sheet,.sheet-backdrop,.drawer-backdrop{display:none}
.m-head,.m-progress,.m-sent-head,.no-sent,.m-full-row{display:none}
@media (max-width:680px){
  .main{flex-direction:column}
  .img-wrap{flex:none;height:44dvh;width:100%}
  .panel{width:100%;flex:1;border-left:none;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px}
  .panel-head,.full-btn,#utilD{display:none}
  .shelf-search{display:none}
  .shelf-item .s{display:block;background:none;color:#7a7263;font-size:12px;font-weight:400;padding:0;border-radius:0;margin-top:2px}
  .shelf-item.on .s{background:none;color:#7a7263}
  .slider-row .slider-num{display:none}
  .sent{font-size:17px;padding:12px}
  .pager{align-items:center}
  .pager-num{display:block;font-weight:700;white-space:nowrap}
  .fab{display:flex;align-items:center;justify-content:center;position:absolute;z-index:5;border:none;color:var(--ink)}
  .fab-shelf{top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 1px 5px rgba(0,0,0,.18)}
  .fab-settings{bottom:8px;left:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 1px 5px rgba(0,0,0,.18)}
  .fab-full{bottom:8px;right:8px;min-width:40px;height:34px;padding:0 10px;border-radius:999px;background:var(--green);color:#fff;font-size:16px;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.25)}
  .fab-full.stop{background:var(--amber)}
  .page-badge{top:8px;right:8px;padding:3px 9px;font-size:12px}
  /* shelf as drawer */
  .shelf{position:fixed;z-index:40;left:0;top:0;bottom:0;height:100dvh;transform:translateX(-105%);transition:transform .25s;box-shadow:2px 0 14px rgba(0,0,0,.18);margin-left:0!important}
  body.shelf-open .shelf{transform:none}
  .shelf-open-btn{display:none!important}
  .drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;opacity:0;pointer-events:none;transition:.25s}
  body.shelf-open .drawer-backdrop{opacity:1;pointer-events:auto}
  /* settings bottom sheet */
  .sheet-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49;opacity:0;pointer-events:none;transition:.25s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:70dvh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  body.sheet-open .sheet{transform:none}
  body.sheet-open .sheet-backdrop{opacity:1;pointer-events:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
  .sheet-head button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px}
  .sheet .speed{display:grid}
  .sheet .auto-row{display:flex;justify-content:space-between;align-items:center;font-weight:600}
  /* ==== redesign v1 (mobile only, per reference mock) ==== */
  body{background:#fffaf0}
  .main{background:#fffaf0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px}
  .m-head button{width:40px;height:40px;flex:none;border:none;background:transparent;color:var(--green-d);display:flex;align-items:center;justify-content:center}
  .m-head button svg{width:24px;height:24px}
  .m-title{flex:1;min-width:0;text-align:center;padding-top:1px}
  .m-title h1{font-size:21px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m-title p{font-size:13px;color:#8a8171;margin-top:3px}
  .img-wrap{flex:none;height:auto;min-height:0;max-height:52dvh;width:auto;margin:2px 16px 0;border-radius:18px;overflow:hidden;background:#fdf6e3;box-shadow:0 2px 10px rgba(60,45,20,.08)}
  .fab{display:none!important}
  .page-badge{display:none}
  .panel{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:10px;background:#fffaf0;border-top:none}
  .img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* compact mode for short screens (<=780px tall): trim panel spacing so two-sentence pages + full-read row still fit one screen */
  @media (max-height:780px){
    .panel{gap:8px;padding-top:10px}
    .sent{padding:10px 12px}
    .m-full-row{padding:11px}
    .pager button{padding:13px}
    .img-wrap{min-height:0}
    .pager{margin-top:10px}
  }
  .pager{margin-top:14px}
  .m-full-row{display:block;width:100%;border:none;background:var(--green);color:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:700}
  .m-full-row.stop{background:var(--amber)}
  .slider-row{display:none}
  .m-progress{display:block}
  .m-progress-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#7a7263}
  .m-progress-row b{color:var(--green-d);font-size:15px}
  .m-prog-bar{height:8px;background:#eae1c9;border-radius:999px;margin-top:8px;overflow:hidden;position:relative}
  .m-prog-fill{height:100%;width:0%;background:var(--green);border-radius:999px;transition:width .25s}
  .sentences{flex:none;overflow:visible}
  .m-sent-head{display:flex;justify-content:space-between;align-items:center}
  .m-sent-head .t{font-size:17px;font-weight:700}
  .sent{background:#f7efdb;border:none;border-radius:16px;padding:12px 14px;gap:12px;font-size:18px;box-shadow:none}
  .sent .sp{width:42px;height:42px;border-radius:50%;background:var(--green)}
  .sent.playing{background:#dff2e4}
  .no-sent{display:block;border:1.5px dashed #d8cdb0;border-radius:16px;padding:16px 14px;text-align:center;color:#8a8171;font-size:15px;background:#fffdf7}
  .pager{gap:12px}
  .pager-num{display:none!important}
  .pager button{padding:16px;border-radius:14px;font-size:17px}
  .pager button svg{display:none}
  .pager #prevBtn{background:#fff;border:1.5px solid #e0d6ba}
  .pager #nextBtn{background:var(--green);border-color:var(--green);color:#fff}
  .pager #nextBtn:disabled{background:var(--green)}
}
@media (min-width:681px){
  .pager{gap:12px}
  .pager button{transition:transform .12s ease,background .12s ease}
  .pager #prevBtn{flex:.78;padding:11px;font-size:14.5px;background:#fff}
  .pager #prevBtn:active{transform:scale(.96);background:#efe8d2}
  .pager #nextBtn{flex:1.3;padding:15px;font-size:16.5px;background:var(--green);border-color:var(--green);color:#fff}
  .pager #nextBtn:active{transform:scale(.96);background:var(--green-d)}
}
</style>
</head>
<body>
<div class="wrap">
  <button class="shelf-open-btn" id="shelfOpenBtn"></button>
  <aside class="shelf" id="shelf">
    <div class="shelf-head"><span>书架</span><button id="shelfCloseBtn" aria-label="收起书架"></button></div>
    <div class="shelf-search"><input id="shelfSearch" type="search" placeholder="搜索书名或编号" aria-label="搜索书名或编号"></div>
    <div class="shelf-list" id="shelfList"></div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <main class="main">
    <header class="m-head">
      <button id="mShelfBtn" aria-label="打开书架"></button>
      <div class="m-title"><h1 id="mBookTitle"></h1><p id="mBookSub"></p></div>
      <button id="mSettingsBtn" aria-label="打开设置"></button>
    </header>
    <div class="img-wrap" id="imgWrap">
      <img id="pageImg" alt="绘本插图">
      <div class="load-veil" id="loadVeil"><img id="veilImg" alt=""><div class="veil-box"><div class="veil-spin"></div><div class="veil-title" id="veilTitle"></div><div class="veil-sub" id="veilSub">正在打开…</div></div></div>
      <button class="fab fab-shelf" id="fabShelf" aria-label="打开书架"></button>
      <div class="page-badge" id="pageBadge">封面</div>
      <button class="fab fab-settings" id="fabSettings" aria-label="打开设置"></button>
      <button class="fab fab-full" id="fabFull" aria-label="全文朗读">全</button>
    </div>
    <section class="panel">
      <div class="m-progress">
        <div class="m-progress-row"><span>阅读进度</span><b id="mProgNum">0 / 16</b></div>
        <div class="m-prog-bar" id="mProgBar"><div class="m-prog-fill" id="mProgFill"></div></div>
      </div>
      <div class="m-sent-head">
        <span class="t" id="mSentTitle">本页朗读</span>
      </div>
      <div class="panel-head">
        <span class="tag" id="bookTag">OXFORD READING TREE · LEVEL 3</span>
        <h1 id="bookTitle"></h1>
        <div class="zh">点读绘本</div>
      </div>
      <div class="slider-row">
        <input type="range" id="pageRange" min="1" max="17" value="1" aria-label="页码滑杆">
        <span class="slider-num" id="sliderNum">封面</span>
      </div>
      <div class="sentences" id="sentences"></div>
      <button class="m-full-row" id="mFullBtn">朗读整本</button>
      <div class="pager">
        <button id="prevBtn"></button>
        <span class="pager-num" id="pagerNum">封面</span>
        <button id="nextBtn"></button>
      </div>
      <button class="full-btn" id="fullBtn">▶ 全文朗读</button>
      <div class="util-wrap" id="utilD">
        <div class="util-row">
          <button class="speed-chip" id="speedChipD" aria-label="语速"></button>
          <button class="gear-btn" id="gearBtnD" aria-label="设置"></button>
        </div>
        <div class="pop speed-pop" id="speedPopD"></div>
        <div class="pop set-pop" id="setPopD">
          <div class="set-row"><div class="tx"><b>翻页后自动朗读</b><span>翻页后，自动读出本页</span></div><span class="switch"><input type="checkbox" id="autoToggle" checked><span class="tr"></span></span></div>
          <div class="set-div"></div>
          <div class="set-row"><div class="tx"><b>连续播放</b><span>读完一本，自动读下一本</span></div><span class="switch"><input type="checkbox" id="chainToggleD"><span class="tr"></span></span></div>
          <div class="chain-chips" id="chainChipsD"><button data-v="seq">顺序</button><button data-v="rand">随机</button></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" aria-label="设置">
  <div class="sheet-head"><span>设置</span><button id="sheetClose" aria-label="关闭设置">✕</button></div>
  <div>
    <div class="sec-title" style="margin-bottom:8px">语速</div>
    <div class="speed" id="speedRowM"></div>
  </div>
  <div>
    <div class="sec-title" style="margin-bottom:8px">连读</div>
    <div class="speed loop" id="loopRowM"></div>
  </div>
  <div class="auto-row"><span>翻页自动读</span>
    <span class="switch"><input type="checkbox" id="autoToggleM" checked><span class="tr"></span></span>
  </div>
</div>
<script>
/* ---- icons: bold rounded SVG (restored to original chunky look) ---- */

/* ---- library / book loading (split structure) ---- */
let LIB = [];                 // manifest entries
const bookCache = new Map();  // no -> Promise<book data>
let bi = -1, bookData = null, page = 0;
let rate = 1.0, autoRead = true, seqToken = 0, fullMode = false, loadToken = 0;
let chainMode = 'rand', chainActive = false;

const book = () => bookData;
const pages = () => bookData ? bookData.pages : [];
const cur = () => pages()[page];
const storyTotal = () => pages().length - 1;   // pages minus cover

function fetchBook(no){
  if (bookCache.has(no)) return bookCache.get(no);
  const entry = LIB.find(b => b.no === no);
  const pr = fetch(entry ? entry.file : ('books/' + no + '.json'))
    .then(r => { if (!r.ok) throw new Error('fetch ' + no); return r.json(); })
    .catch(e => { bookCache.delete(no); throw e; });
  bookCache.set(no, pr);
  return pr;
}
function prefetchNext(){
  if (bi < 0 || bi >= LIB.length - 1) return;
  const nxt = LIB[bi + 1];
  setTimeout(() => { fetchBook(nxt.no).catch(() => {}); }, 1200);
}

/* ---- image cache: max-3 concurrency queue, failures not cached ---- */
const imgCache = new Map();
function ensureImage(p){
  if (!bookData) return Promise.resolve(false);
  const key = bookData.no + ':' + p;
  if (imgCache.has(key)) return imgCache.get(key);
  const src = pages()[p] && pages()[p].img;
  if (!src) return Promise.resolve(false);
  const pr = new Promise(res => {
    const im = new Image();
    im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).finally(() => res(true)); };
    im.onerror = () => { imgCache.delete(key); res(false); };
    im.src = src;
  });
  imgCache.set(key, pr);
  return pr;
}
function preloadBook(){
  if (!bookData) return;
  const order = [page + 1, page - 1];
  for (let i = 0; i < pages().length; i++) order.push(i);
  const seen = new Set(), q = order.filter(p => p >= 0 && p < pages().length && !seen.has(p) && seen.add(p));
  let idx = 0;
  const workers = Array.from({length: 3}, async () => { while (idx < q.length) { const p = q[idx++]; await ensureImage(p); } });
  workers.forEach(w => w.catch(() => {}));
}

/* ---- audio ---- */
const player = new Audio();
let playingBtn = null, playSeq = 0;
function clearPlaying(){ if (playingBtn) { playingBtn.classList.remove('playing'); playingBtn = null; } }
function setPlaying(btn){
  clearPlaying();
  if (btn) { playingBtn = btn; btn.classList.add('playing'); btn.scrollIntoView({block: 'nearest'}); }
}
function playAudioFile(file, btn){
  const my = ++playSeq;
  setPlaying(btn || null);
  return new Promise(res => {
    let settled = false;
    const done = () => {
      if (settled) return; settled = true;
      player.removeEventListener('ended', done);
      player.removeEventListener('error', done);
      /* fix: when THIS play finishes naturally, remove its own highlight.
         Stale finishes (superseded by a newer play) must not clear the new one. */
      if (my === playSeq) clearPlaying();
      res();
    };
    player.pause();
    player.src = file;
    player.playbackRate = rate;
    player.addEventListener('ended', done);
    player.addEventListener('error', done);
    player.play().catch(() => done());
  });
}

/* ---- sequence engine ---- */
function stopSeq(){ seqToken++; playSeq++; fullMode = false; chainActive = false; setFullBtn(); player.pause(); clearPlaying(); hideVeil(); }
async function waitImg(p, token){
  const t = new Promise(r => setTimeout(r, 6000));
  await Promise.race([ensureImage(p), t]);
  return token === seqToken;
}
async function runPageRead(token){
  if (!await waitImg(page, token)) return;
  if (token !== seqToken) return;
  const sents = cur().sentences;
  for (let i = 0; i < sents.length; i++){
    if (token !== seqToken) return;
    const btn = $('sentences').children[i];
    await playAudioFile(sents[i].audio, btn);
  }
  if (token === seqToken) clearPlaying();
}
async function readBookToEnd(token){
  while (token === seqToken){
    if (!await waitImg(page, token)) return false;
    if (token !== seqToken) return false;
    const sents = cur().sentences;
    if (sents.length === 0){
      await new Promise(r => setTimeout(r, 1200));
      if (token !== seqToken) return false;
    } else {
      for (let i = 0; i < sents.length; i++){
        if (token !== seqToken) return false;
        const btn = $('sentences').children[i];
        await playAudioFile(sents[i].audio, btn);
      }
      if (token !== seqToken) return false;
      clearPlaying();
    }
    if (page >= pages().length - 1) return true;
    page++; render();
  }
  return false;
}
async function runFull(token){
  await readBookToEnd(token);
  if (token === seqToken){ fullMode = false; setFullBtn(); clearPlaying(); }
}
function setFullBtn(){
  $('fullBtn').textContent = fullMode ? '停止' : '▶ 全文朗读';
  $('fullBtn').classList.toggle('stop', fullMode);
  $('fabFull').textContent = fullMode ? '停' : '全';
  $('fabFull').classList.toggle('stop', fullMode);
  $('fabFull').setAttribute('aria-label', fullMode ? '停止全文朗读' : '全文朗读');
  $('mFullBtn').textContent = fullMode ? '停止朗读' : '▶ 朗读整本';
  $('mFullBtn').classList.toggle('stop', fullMode);
  syncChain();
}
function startFull(){ stopSeq(); fullMode = true; setFullBtn(); runFull(++seqToken); }

/* ---- chain (loop) playback: settings-driven, not tied to full-read ---- */
function pickNext(){
  if (LIB.length <= 1) return bi;
  if (chainMode === 'seq') return (bi + 1) % LIB.length;
  let n = bi;
  while (n === bi) n = Math.floor(Math.random() * LIB.length);
  return n;
}
async function chainLoad(i, token){
  const entry = LIB[i];
  markShelf(entry.no); setTitles(entry); showVeil(entry);
  const data = await fetchBook(entry.no).catch(() => null);
  if (token !== seqToken) return false;
  if (!data){ veilError(); return false; }
  bi = i; bookData = data; page = 0;
  render(); hideVeil(); preloadBook();
  return true;
}
async function runChain(token){
  while (token === seqToken && chainActive){
    const done = await readBookToEnd(token);
    if (!done || token !== seqToken || !chainActive || chainMode === 'off') break;
    const ok = await chainLoad(pickNext(), token);
    if (!ok) break;
  }
  if (token === seqToken){ chainActive = false; fullMode = false; setFullBtn(); clearPlaying(); }
}
function startChain(){ stopSeq(); chainActive = true; fullMode = true; setFullBtn(); runChain(++seqToken); }

/* ---- render ---- */
function pageLabel(){ return page === 0 ? '封面' : (page + ' / ' + storyTotal()); }
function render(){
  if (!bookData) return;
  const b = bookData;
  clearPlaying();
  $('bookTitle').textContent = b.title;
  $('mBookTitle').textContent = b.title;
  $('mBookSub').textContent = 'Oxford Reading Tree · ' + (b.level || 'Level 3');
  $('mProgNum').textContent = page + ' / ' + storyTotal();
  $('mProgFill').style.width = (storyTotal() ? (page / storyTotal() * 100) : 0) + '%';
  $('mSentTitle').textContent = page === 0 ? '封面朗读' : '本页朗读';
  $('bookTag').textContent = ('OXFORD READING TREE · ' + (b.level || 'LEVEL 3')).toUpperCase();
  ensureImage(page);
  const img = $('pageImg');
  const src = cur().img;
  img.onerror = () => { imgCache.delete(b.no + ':' + page); ensureImage(page).then(ok => { if (ok && cur() && cur().img === src) img.src = src; }); };
  if (img.getAttribute('src') !== src) img.src = src;   // keep old frame until new one is set; data-URI swaps are near-instant
  const box = $('sentences'); box.innerHTML = '';
  cur().sentences.forEach(s => {
    const btn = document.createElement('button'); btn.className = 'sent';
    const sp = document.createElement('span'); sp.className = 'sp'; sp.innerHTML = IC.spk;
    const tx = document.createElement('span'); tx.textContent = s.text;
    btn.appendChild(sp); btn.appendChild(tx);
    btn.onclick = () => { stopSeq(); playAudioFile(s.audio, btn); };
    box.appendChild(btn);
  });
  if (cur().sentences.length === 0){
    const d = document.createElement('div'); d.className = 'no-sent'; d.textContent = '这一页没有文字，看看图画吧';
    box.appendChild(d);
  }
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = page === pages().length - 1;
  $('sliderNum').textContent = pageLabel();
  $('pagerNum').textContent = pageLabel();
  $('pageBadge').textContent = page === 0 ? '封面' : ('第 ' + page + ' 页');
  const r = $('pageRange'); r.max = pages().length; if (document.activeElement !== r) r.value = page + 1;
  document.querySelectorAll('#shelfList .shelf-item').forEach(el => el.classList.toggle('on', LIB[bi] && el.dataset.no === LIB[bi].no));
}
function gotoPage(p, opts = {}){
  p = Math.max(0, Math.min(pages().length - 1, p));
  if (p === page && !opts.force) return;
  page = p; render();
  if (opts.read && autoRead && cur().sentences.length) runPageRead(++seqToken);
  else if (opts.read) seqToken++;
}

/* ---- shelf ---- */
function renderShelf(){
  const list = $('shelfList'); list.innerHTML = '';
  const sorted = [...LIB].sort((a, b) => parseInt(a.no) - parseInt(b.no));
  sorted.forEach(entry => {
    const el = document.createElement('button');
    el.className = 'shelf-item'; el.dataset.no = entry.no;
    el.innerHTML = '<img alt=""><span><span class="t"></span><span class="s"></span></span>';
    el.querySelector('img').src = entry.thumb;
    el.querySelector('.t').textContent = entry.title;
    el.querySelector('.s').textContent = (entry.level || 'Level 3') + ' · ' + entry.no;
    el.onclick = () => { selectBook(LIB.indexOf(entry)); document.body.classList.remove('shelf-open'); };
    list.appendChild(el);
  });
  applySearch();
}
function applySearch(){
  const inp = $('shelfSearch'); if (!inp) return;
  const q = inp.value.trim().toLowerCase();
  document.querySelectorAll('#shelfList .shelf-item').forEach(el => {
    const e = LIB.find(b => b.no === el.dataset.no);
    const hit = !q || (e && (e.title.toLowerCase().includes(q) || e.no.includes(q)));
    el.style.display = hit ? '' : 'none';
  });
}
$('shelfSearch').addEventListener('input', applySearch);
let pendingNo = null;
function markShelf(no){
  const mob = window.matchMedia('(max-width: 680px)').matches;
  document.querySelectorAll('#shelfList .shelf-item').forEach(el => {
    const on = el.dataset.no === no;
    el.classList.toggle('on', on);
    const pill = el.querySelector('.s');
    if (pill){
      const e = LIB.find(b => b.no === el.dataset.no);
      const lv = (e && e.level) || 'Level 3';
      pill.textContent = (on && !mob) ? ('正在读 · ' + lv) : (lv + ' · ' + el.dataset.no);
    }
  });
}
function setTitles(e){
  $('bookTitle').textContent = e.title;
  $('mBookTitle').textContent = e.title;
  $('mBookSub').textContent = 'Oxford Reading Tree · ' + (e.level || 'Level 3');
  $('bookTag').textContent = ('OXFORD READING TREE · ' + (e.level || 'LEVEL 3')).toUpperCase();
}
function showVeil(e){
  pendingNo = e.no;
  $('veilImg').src = e.thumb || '';
  $('veilTitle').textContent = e.title;
  $('veilSub').textContent = '正在打开…';
  $('loadVeil').classList.remove('error');
  $('loadVeil').classList.add('show');
  document.querySelector('.main').classList.add('loading');
}
function hideVeil(){
  $('loadVeil').classList.remove('show');
  document.querySelector('.main').classList.remove('loading');
}
function veilError(){
  $('loadVeil').classList.add('error');
  $('veilSub').textContent = '没打开，点一下重试';
}
$('loadVeil').onclick = () => {
  if (!$('loadVeil').classList.contains('error') || !pendingNo) return;
  const i = LIB.findIndex(b => b.no === pendingNo);
  if (i >= 0) selectBook(i);
};
async function selectBook(i){
  if (i < 0 || i >= LIB.length) return;
  stopSeq();
  const entry = LIB[i];
  markShelf(entry.no);
  setTitles(entry);
  showVeil(entry);
  const my = ++loadToken;
  const data = await fetchBook(entry.no).catch(() => null);
  if (my !== loadToken) return;
  if (!data){ veilError(); return; }
  bi = i; bookData = data; page = 0;
  render(); hideVeil(); preloadBook(); prefetchNext();
}

/* ---- controls ---- */
$('prevBtn').onclick = () => { stopSeq(); gotoPage(page - 1, {read: true}); };
$('nextBtn').onclick = () => { stopSeq(); gotoPage(page + 1, {read: true}); };
const range = $('pageRange');
range.addEventListener('input', () => { stopSeq(); const p = parseInt(range.value) - 1; if (p !== page) { page = p; render(); } });
range.addEventListener('change', () => { if (autoRead && cur() && cur().sentences.length) runPageRead(++seqToken); });
const RATES = [{v: 0.5, d: '0.5×', t: '超慢'}, {v: 0.7, d: '0.7×', t: '慢'}, {v: 0.85, d: '0.85×', t: '较慢'}, {v: 1, d: '1.0×', t: '正常'}, {v: 1.2, d: '1.2×', t: '快'}];
function bindSpeed(row){
  RATES.forEach(r => {
    const b = document.createElement('button'); b.dataset.v = r.v;
    b.textContent = r.d;
    const sm = document.createElement('small'); sm.textContent = r.t; b.appendChild(sm);
    b.onclick = () => { rate = r.v; player.playbackRate = rate; syncSpeed(); };
    row.appendChild(b);
  });
}
const POPRATES = [1.2, 1, 0.85, 0.7, 0.5];
function rateLabel(v){ return (v === 1 ? '1.0' : String(v)) + '×'; }
function buildSpeedPop(pop){
  POPRATES.forEach(v => {
    const b = document.createElement('button'); b.dataset.v = v; b.textContent = rateLabel(v);
    b.onclick = () => { rate = v; player.playbackRate = rate; syncSpeed(); closePops(); };
    pop.appendChild(b);
  });
}
function syncSpeed(){
  document.querySelectorAll('#speedRowM button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.v) === rate));
  document.querySelectorAll('.speed-pop button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.v) === rate));
  document.querySelectorAll('.chip-val').forEach(el => el.textContent = rateLabel(rate));
}
function closePops(){
  document.querySelectorAll('.pop').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.speed-chip,.gear-btn').forEach(b => b.classList.remove('on'));
}
function bindUtilD(){
  const chip = $('speedChipD'), gear = $('gearBtnD'), sp = $('speedPopD'), tp = $('setPopD');
  chip.innerHTML = IC.gauge + '<span class="chip-val"></span>';
  gear.innerHTML = IC.gearL;
  chip.onclick = e => { e.stopPropagation(); const open = sp.classList.contains('show'); closePops(); if (!open){ sp.classList.add('show'); chip.classList.add('on'); } };
  gear.onclick = e => { e.stopPropagation(); const open = tp.classList.contains('show'); closePops(); if (!open){ tp.classList.add('show'); gear.classList.add('on'); } };
  sp.addEventListener('click', e => e.stopPropagation());
  tp.addEventListener('click', e => e.stopPropagation());
}
function syncChain(){
  const tg = $('chainToggleD'), ch = $('chainChipsD');
  if (tg) tg.checked = chainActive;
  if (ch){ ch.classList.toggle('show', chainActive); ch.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === chainMode)); }
}
function bindChainD(){
  $('chainToggleD').addEventListener('change', e => { if (e.target.checked) startChain(); else stopSeq(); });
  $('chainChipsD').querySelectorAll('button').forEach(b => {
    b.onclick = () => { chainMode = b.dataset.v; if (!chainActive) startChain(); else syncChain(); };
  });
}
bindSpeed($('speedRowM'));
buildSpeedPop($('speedPopD'));
bindUtilD(); bindChainD();
syncSpeed(); syncChain();
document.addEventListener('click', closePops);
const LOOPS = [{v: 'off', d: '关'}, {v: 'seq', d: '按序号'}, {v: 'rand', d: '随机'}];
function bindLoop(row){
  LOOPS.forEach(o => {
    const b = document.createElement('button'); b.dataset.v = o.v;
    b.textContent = o.d;
    b.onclick = () => {
      if (o.v === 'off'){ chainMode = 'off'; syncLoop(); stopSeq(); return; }
      chainMode = o.v; syncLoop();
      if (!chainActive) startChain();
    };
    row.appendChild(b);
  });
}
function syncLoop(){ document.querySelectorAll('#loopRowM button').forEach(b => b.classList.toggle('on', b.dataset.v === chainMode)); }
bindLoop($('loopRowM')); syncLoop();
function bindAuto(el, other){ el.addEventListener('change', () => { autoRead = el.checked; other.checked = autoRead; }); }
bindAuto($('autoToggle'), $('autoToggleM')); bindAuto($('autoToggleM'), $('autoToggle'));
$('fullBtn').onclick = () => { fullMode ? stopSeq() : startFull(); };
$('fabFull').onclick = () => { fullMode ? stopSeq() : startFull(); };
/* shelf open/close */
$('shelfCloseBtn').onclick = () => { if (window.innerWidth <= 680) document.body.classList.remove('shelf-open'); else document.body.classList.add('shelf-closed'); };
$('shelfOpenBtn').onclick = () => document.body.classList.remove('shelf-closed');
$('fabShelf').onclick = () => document.body.classList.add('shelf-open');
$('drawerBackdrop').onclick = () => document.body.classList.remove('shelf-open');
/* sheet */
$('fabSettings').onclick = () => document.body.classList.add('sheet-open');
$('sheetClose').onclick = () => document.body.classList.remove('sheet-open');
$('sheetBackdrop').onclick = () => document.body.classList.remove('sheet-open');
/* swipe + keys */
let tx = null;
$('imgWrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive: true});
$('imgWrap').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 42) { stopSeq(); gotoPage(page + (dx < 0 ? 1 : -1), {read: true}); } }, {passive: true});
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { stopSeq(); gotoPage(page + 1, {read: true}); } if (e.key === 'ArrowLeft') { stopSeq(); gotoPage(page - 1, {read: true}); } });

/* ---- redesign v1 mobile controls ---- */
$('mShelfBtn').onclick = () => document.body.classList.add('shelf-open');
$('mSettingsBtn').onclick = () => document.body.classList.add('sheet-open');
$('mFullBtn').onclick = () => { fullMode ? stopSeq() : startFull(); };
(() => {
  const bar = $('mProgBar'); if (!bar) return;
  const wrap = bar.parentElement;
  wrap.style.touchAction = 'none';
  let dragP = null;
  const ratioOf = (x) => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)); };
  const showDrag = () => { $('mProgFill').style.width = (dragP / storyTotal() * 100) + '%'; $('mProgNum').textContent = dragP + ' / ' + storyTotal(); };
  wrap.addEventListener('pointerdown', (e) => { dragP = Math.round(ratioOf(e.clientX) * storyTotal()); try { wrap.setPointerCapture(e.pointerId); } catch(_){} showDrag(); e.preventDefault(); });
  wrap.addEventListener('pointermove', (e) => { if (dragP === null) return; dragP = Math.round(ratioOf(e.clientX) * storyTotal()); showDrag(); });
  const endDrag = () => { if (dragP === null) return; const p = dragP; dragP = null; stopSeq(); if (p !== page) { page = p; render(); if (autoRead && cur() && cur().sentences.length) runPageRead(++seqToken); } else { render(); } };
  wrap.addEventListener('pointerup', endDrag);
  wrap.addEventListener('pointercancel', () => { dragP = null; render(); });
})();

/* ---- boot ---- */
fetch('books/manifest.json').then(r => r.json()).then(m => {
  LIB = m;
  renderShelf();
  selectBook(0);
}).catch(() => {});
</script>
</body>
</html>
