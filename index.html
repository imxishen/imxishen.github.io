<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牛津阅读树 · 点读绘本</title>
<style>
:root{--green:#1d7a4f;--green-d:#166b42;--amber:#d97706;--ink:#20312a;--paper:#fdf6e3;--card:#fffdf7;--line:#e5dcc3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3ecd9;color:var(--ink);overflow:hidden}
.wrap{display:flex;height:100dvh;width:100%}
button{font-family:inherit;cursor:pointer}
svg.ic{display:block;flex:none}
/* shelf (desktop) */
.shelf{width:208px;flex:none;background:#fbf7ea;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:margin .25s}
.shelf-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;font-weight:700}
.shelf-head button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.shelf-list{overflow-y:auto;padding:4px 8px 12px;display:flex;flex-direction:column;gap:8px}
.shelf-item{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid transparent;background:#fff;border-radius:12px;padding:8px;width:100%}
.shelf-item.on{border-color:var(--green);background:#eef7f0}
.shelf-item img{width:40px;height:49px;object-fit:cover;border-radius:6px;flex:none}
.shelf-item .t{font-weight:700;font-size:14px;line-height:1.25}
.shelf-item .s{font-size:12px;color:#7a7263;margin-top:2px}
body.shelf-closed .shelf{margin-left:-208px}
.shelf-open-btn{display:none;position:fixed;left:10px;top:10px;z-index:30;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);align-items:center;gap:6px;color:var(--ink)}
body.shelf-closed .shelf-open-btn{display:flex}
/* main */
.main{flex:1;display:flex;min-width:0}
.img-wrap{flex:1;position:relative;background:var(--paper);display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.img-wrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.page-badge{position:absolute;top:12px;right:12px;background:rgba(32,49,42,.82);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.fab{display:none}
.panel{width:344px;flex:none;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;gap:12px;min-height:0}
.tag{align-self:flex-start;background:#e3f2e7;color:var(--green-d);font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px}
.panel h1{font-size:27px;line-height:1.25;margin-top:8px}
.zh{color:#54604f;font-size:16px;font-weight:600;margin-top:3px;line-height:1.4}
.sentences{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.sent{display:flex;align-items:center;gap:10px;text-align:left;background:#fdf6de;border:1.5px solid #ead9ae;border-radius:14px;padding:14px;font-size:19px;font-weight:600;line-height:1.35;color:var(--ink)}
.sent .sp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.sent.playing{background:#dff2e4;border-color:var(--green)}
.pager{display:flex;gap:10px}
.pager button{flex:1;padding:13px;border-radius:12px;border:1.5px solid #d8cdb0;background:#fff8e6;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink)}
.pager button:disabled{opacity:.38;cursor:default}
.pager-num{display:none}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{flex:1;accent-color:var(--green);height:28px}
.slider-num{font-weight:700;white-space:nowrap}
.read-row{display:flex;align-items:center;gap:12px}
.full-btn{flex:1;background:var(--green);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700}
.full-btn.stop{background:var(--amber)}
.auto-wrap{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.switch{position:relative;width:48px;height:27px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.switch .tr{position:absolute;inset:0;background:#cfc7ab;border-radius:999px;transition:.2s}
.switch .tr:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .tr{background:var(--green)}
.switch input:checked + .tr:after{left:24px}
.sec-title{font-weight:700;font-size:15px}
.speed{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.speed button{border:1.5px solid #d8cdb0;background:#fff;border-radius:10px;padding:8px 2px;font-size:13px;font-weight:700}
.speed button small{display:block;font-weight:500;color:#7a7263;font-size:11px}
.speed button.on{background:var(--green);color:#fff;border-color:var(--green)}
.speed button.on small{color:#d9ecdf}
.sheet,.sheet-backdrop,.drawer-backdrop{display:none}
@media (max-width:680px){
  .main{flex-direction:column}
  .img-wrap{flex:none;height:44dvh;width:100%}
  .panel{width:100%;flex:1;border-left:none;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px}
  .panel-head,.read-row,.speed-sec{display:none}
  .slider-row .slider-num{display:none}
  .sent{font-size:17px;padding:12px}
  .pager{align-items:center}
  .pager-num{display:block;font-weight:700;white-space:nowrap}
  .fab{display:flex;align-items:center;justify-content:center;position:absolute;z-index:5;border:none;color:var(--ink)}
  .fab-shelf{top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 1px 5px rgba(0,0,0,.18)}
  .fab-settings{bottom:8px;left:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 1px 5px rgba(0,0,0,.18)}
  .fab-full{bottom:8px;right:8px;min-width:40px;height:34px;padding:0 10px;border-radius:999px;background:var(--green);color:#fff;font-size:16px;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.25)}
  .fab-full.stop{background:var(--amber)}
  .page-badge{top:8px;right:8px;padding:3px 9px;font-size:12px}
  /* shelf as drawer */
  .shelf{position:fixed;z-index:40;left:0;top:0;bottom:0;height:100dvh;transform:translateX(-105%);transition:transform .25s;box-shadow:2px 0 14px rgba(0,0,0,.18);margin-left:0!important}
  body.shelf-open .shelf{transform:none}
  .shelf-open-btn{display:none!important}
  .drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;opacity:0;pointer-events:none;transition:.25s}
  body.shelf-open .drawer-backdrop{opacity:1;pointer-events:auto}
  /* settings bottom sheet */
  .sheet-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49;opacity:0;pointer-events:none;transition:.25s}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:70dvh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  body.sheet-open .sheet{transform:none}
  body.sheet-open .sheet-backdrop{opacity:1;pointer-events:auto}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
  .sheet-head button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px}
  .sheet .speed{display:grid}
  .sheet .auto-row{display:flex;justify-content:space-between;align-items:center;font-weight:600}
}
</style>
</head>
<body>
<div class="wrap">
  <button class="shelf-open-btn" id="shelfOpenBtn"></button>
  <aside class="shelf" id="shelf">
    <div class="shelf-head"><span>书架</span><button id="shelfCloseBtn" aria-label="收起书架"></button></div>
    <div class="shelf-list" id="shelfList"></div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <main class="main">
    <div class="img-wrap" id="imgWrap">
      <img id="pageImg" alt="绘本插图">
      <button class="fab fab-shelf" id="fabShelf" aria-label="打开书架"></button>
      <div class="page-badge" id="pageBadge">封面</div>
      <button class="fab fab-settings" id="fabSettings" aria-label="打开设置"></button>
      <button class="fab fab-full" id="fabFull" aria-label="全文朗读">全</button>
    </div>
    <section class="panel">
      <div class="panel-head">
        <span class="tag" id="bookTag">OXFORD READING TREE · LEVEL 3</span>
        <h1 id="bookTitle"></h1>
        <div class="zh">点读绘本</div>
      </div>
      <div class="slider-row">
        <input type="range" id="pageRange" min="1" max="17" value="1" aria-label="页码滑杆">
        <span class="slider-num" id="sliderNum">封面</span>
      </div>
      <div class="sentences" id="sentences"></div>
      <div class="pager">
        <button id="prevBtn"></button>
        <span class="pager-num" id="pagerNum">封面</span>
        <button id="nextBtn"></button>
      </div>
      <div class="read-row">
        <button class="full-btn" id="fullBtn">全文朗读</button>
        <label class="auto-wrap">翻页自动读
          <span class="switch"><input type="checkbox" id="autoToggle" checked><span class="tr"></span></span>
        </label>
      </div>
      <div class="speed-sec">
        <div class="sec-title" style="margin-bottom:8px">语速</div>
        <div class="speed" id="speedRow"></div>
      </div>
    </section>
  </main>
</div>
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" aria-label="设置">
  <div class="sheet-head"><span>设置</span><button id="sheetClose" aria-label="关闭设置">✕</button></div>
  <div>
    <div class="sec-title" style="margin-bottom:8px">语速</div>
    <div class="speed" id="speedRowM"></div>
  </div>
  <div class="auto-row"><span>翻页自动读</span>
    <span class="switch"><input type="checkbox" id="autoToggleM" checked><span class="tr"></span></span>
  </div>
</div>
<script>
/* ---- icons: bold rounded SVG (restored to original chunky look) ---- */
const IC = {
  book: '<svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.1C6.3 3.7 9.9 3.8 12 6c2.1-2.2 5.7-2.3 8-.9v13.8c-2.3-1.4-5.9-1.3-8 .9-2.1-2.2-5.7-2.3-8-.9z"/><path d="M12 6v13.8"/></svg>',
  gear: '<svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(0 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(45 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(90 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(135 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(180 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(225 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(270 12 12)"/><rect x="10.85" y="1.3" width="2.3" height="4.8" rx="1.15" transform="rotate(315 12 12)"/><path fill-rule="evenodd" d="M12 5.4a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2Zm0 3.3a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"/></svg>',
  spk: '<svg class="ic" width="19" height="19" viewBox="0 0 24 24"><path d="M3.5 9.3v5.4h3.4L12 19V5L6.9 9.3z" fill="#fff"/><path d="M15.2 9.1a4.1 4.1 0 0 1 0 5.8M17.6 6.6a7.5 7.5 0 0 1 0 10.8" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/></svg>',
  prev: '<svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5.2M11 5.5 4.8 12l6.2 6.5"/></svg>',
  next: '<svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14.8M13 5.5l6.2 6.5-6.2 6.5"/></svg>',
  chevL: '<svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14.8 4.8 7.6 12l7.2 7.2"/></svg>'
};
function $(id){ return document.getElementById(id); }
$('shelfOpenBtn').innerHTML = IC.book + '<span>书架</span>';
$('shelfCloseBtn').innerHTML = IC.chevL;
$('fabShelf').innerHTML = IC.book;
$('fabSettings').innerHTML = IC.gear;
$('prevBtn').innerHTML = IC.prev + '<span>上一页</span>';
$('nextBtn').innerHTML = '<span>下一页</span>' + IC.next;

/* ---- library / book loading (split structure) ---- */
let LIB = [];                 // manifest entries
const bookCache = new Map();  // no -> Promise<book data>
let bi = -1, bookData = null, page = 0;
let rate = 1.0, autoRead = true, seqToken = 0, fullMode = false, loadToken = 0;

const book = () => bookData;
const pages = () => bookData ? bookData.pages : [];
const cur = () => pages()[page];
const storyTotal = () => pages().length - 1;   // pages minus cover

function fetchBook(no){
  if (bookCache.has(no)) return bookCache.get(no);
  const entry = LIB.find(b => b.no === no);
  const pr = fetch(entry ? entry.file : ('books/' + no + '.json'))
    .then(r => { if (!r.ok) throw new Error('fetch ' + no); return r.json(); })
    .catch(e => { bookCache.delete(no); throw e; });
  bookCache.set(no, pr);
  return pr;
}
function prefetchNext(){
  if (bi < 0 || bi >= LIB.length - 1) return;
  const nxt = LIB[bi + 1];
  setTimeout(() => { fetchBook(nxt.no).catch(() => {}); }, 1200);
}

/* ---- image cache: max-3 concurrency queue, failures not cached ---- */
const imgCache = new Map();
function ensureImage(p){
  if (!bookData) return Promise.resolve(false);
  const key = bookData.no + ':' + p;
  if (imgCache.has(key)) return imgCache.get(key);
  const src = pages()[p] && pages()[p].img;
  if (!src) return Promise.resolve(false);
  const pr = new Promise(res => {
    const im = new Image();
    im.onload = () => { (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).finally(() => res(true)); };
    im.onerror = () => { imgCache.delete(key); res(false); };
    im.src = src;
  });
  imgCache.set(key, pr);
  return pr;
}
function preloadBook(){
  if (!bookData) return;
  const order = [page + 1, page - 1];
  for (let i = 0; i < pages().length; i++) order.push(i);
  const seen = new Set(), q = order.filter(p => p >= 0 && p < pages().length && !seen.has(p) && seen.add(p));
  let idx = 0;
  const workers = Array.from({length: 3}, async () => { while (idx < q.length) { const p = q[idx++]; await ensureImage(p); } });
  workers.forEach(w => w.catch(() => {}));
}

/* ---- audio ---- */
const player = new Audio();
let playingBtn = null, playSeq = 0;
function clearPlaying(){ if (playingBtn) { playingBtn.classList.remove('playing'); playingBtn = null; } }
function setPlaying(btn){
  clearPlaying();
  if (btn) { playingBtn = btn; btn.classList.add('playing'); btn.scrollIntoView({block: 'nearest'}); }
}
function playAudioFile(file, btn){
  const my = ++playSeq;
  setPlaying(btn || null);
  return new Promise(res => {
    let settled = false;
    const done = () => {
      if (settled) return; settled = true;
      player.removeEventListener('ended', done);
      player.removeEventListener('error', done);
      /* fix: when THIS play finishes naturally, remove its own highlight.
         Stale finishes (superseded by a newer play) must not clear the new one. */
      if (my === playSeq) clearPlaying();
      res();
    };
    player.pause();
    player.src = file;
    player.playbackRate = rate;
    player.addEventListener('ended', done);
    player.addEventListener('error', done);
    player.play().catch(() => done());
  });
}

/* ---- sequence engine ---- */
function stopSeq(){ seqToken++; playSeq++; fullMode = false; setFullBtn(); player.pause(); clearPlaying(); }
async function waitImg(p, token){
  const t = new Promise(r => setTimeout(r, 6000));
  await Promise.race([ensureImage(p), t]);
  return token === seqToken;
}
async function runPageRead(token){
  if (!await waitImg(page, token)) return;
  if (token !== seqToken) return;
  const sents = cur().sentences;
  for (let i = 0; i < sents.length; i++){
    if (token !== seqToken) return;
    const btn = $('sentences').children[i];
    await playAudioFile(sents[i].audio, btn);
  }
  if (token === seqToken) clearPlaying();
}
async function runFull(token){
  while (token === seqToken){
    if (!await waitImg(page, token)) return;
    if (token !== seqToken) return;
    const sents = cur().sentences;
    if (sents.length === 0){
      await new Promise(r => setTimeout(r, 1200));
      if (token !== seqToken) return;
    } else {
      for (let i = 0; i < sents.length; i++){
        if (token !== seqToken) return;
        const btn = $('sentences').children[i];
        await playAudioFile(sents[i].audio, btn);
      }
      if (token !== seqToken) return;
      clearPlaying();
    }
    if (page >= pages().length - 1) break;
    page++; render();
  }
  if (token === seqToken){ fullMode = false; setFullBtn(); clearPlaying(); }
}
function setFullBtn(){
  $('fullBtn').textContent = fullMode ? '停止' : '全文朗读';
  $('fullBtn').classList.toggle('stop', fullMode);
  $('fabFull').textContent = fullMode ? '停' : '全';
  $('fabFull').classList.toggle('stop', fullMode);
  $('fabFull').setAttribute('aria-label', fullMode ? '停止全文朗读' : '全文朗读');
}
function startFull(){ stopSeq(); fullMode = true; setFullBtn(); runFull(++seqToken); }

/* ---- render ---- */
function pageLabel(){ return page === 0 ? '封面' : (page + ' / ' + storyTotal()); }
function render(){
  if (!bookData) return;
  const b = bookData;
  clearPlaying();
  $('bookTitle').textContent = b.title;
  $('bookTag').textContent = ('OXFORD READING TREE · ' + (b.level || 'LEVEL 3')).toUpperCase();
  ensureImage(page);
  const img = $('pageImg');
  const src = cur().img;
  img.onerror = () => { imgCache.delete(b.no + ':' + page); ensureImage(page).then(ok => { if (ok && cur() && cur().img === src) img.src = src; }); };
  if (img.getAttribute('src') !== src) img.src = src;   // keep old frame until new one is set; data-URI swaps are near-instant
  const box = $('sentences'); box.innerHTML = '';
  cur().sentences.forEach(s => {
    const btn = document.createElement('button'); btn.className = 'sent';
    const sp = document.createElement('span'); sp.className = 'sp'; sp.innerHTML = IC.spk;
    const tx = document.createElement('span'); tx.textContent = s.text;
    btn.appendChild(sp); btn.appendChild(tx);
    btn.onclick = () => { stopSeq(); playAudioFile(s.audio, btn); };
    box.appendChild(btn);
  });
  $('prevBtn').disabled = page === 0;
  $('nextBtn').disabled = page === pages().length - 1;
  $('sliderNum').textContent = pageLabel();
  $('pagerNum').textContent = pageLabel();
  $('pageBadge').textContent = page === 0 ? '封面' : ('第 ' + page + ' 页');
  const r = $('pageRange'); r.max = pages().length; if (document.activeElement !== r) r.value = page + 1;
  document.querySelectorAll('#shelfList .shelf-item').forEach(el => el.classList.toggle('on', LIB[bi] && el.dataset.no === LIB[bi].no));
}
function gotoPage(p, opts = {}){
  p = Math.max(0, Math.min(pages().length - 1, p));
  if (p === page && !opts.force) return;
  page = p; render();
  if (opts.read && autoRead && cur().sentences.length) runPageRead(++seqToken);
  else if (opts.read) seqToken++;
}

/* ---- shelf ---- */
function renderShelf(){
  const list = $('shelfList'); list.innerHTML = '';
  const sorted = [...LIB].sort((a, b) => parseInt(a.no) - parseInt(b.no));
  sorted.forEach(entry => {
    const el = document.createElement('button');
    el.className = 'shelf-item'; el.dataset.no = entry.no;
    el.innerHTML = '<img alt=""><span><span class="t"></span><span class="s" style="display:block"></span></span>';
    el.querySelector('img').src = entry.thumb;
    el.querySelector('.t').textContent = entry.title;
    el.querySelector('.s').textContent = (entry.level || 'Level 3') + ' · ' + entry.no;
    el.onclick = () => { selectBook(LIB.indexOf(entry)); document.body.classList.remove('shelf-open'); };
    list.appendChild(el);
  });
}
async function selectBook(i){
  if (i < 0 || i >= LIB.length) return;
  stopSeq();
  const my = ++loadToken;
  const data = await fetchBook(LIB[i].no).catch(() => null);
  if (!data || my !== loadToken) return;
  bi = i; bookData = data; page = 0;
  render(); preloadBook(); prefetchNext();
}

/* ---- controls ---- */
$('prevBtn').onclick = () => { stopSeq(); gotoPage(page - 1, {read: true}); };
$('nextBtn').onclick = () => { stopSeq(); gotoPage(page + 1, {read: true}); };
const range = $('pageRange');
range.addEventListener('input', () => { stopSeq(); const p = parseInt(range.value) - 1; if (p !== page) { page = p; render(); } });
range.addEventListener('change', () => { if (autoRead && cur() && cur().sentences.length) runPageRead(++seqToken); });
const RATES = [{v: 0.5, d: '0.5×', t: '超慢'}, {v: 0.7, d: '0.7×', t: '慢'}, {v: 0.85, d: '0.85×', t: '较慢'}, {v: 1, d: '1.0×', t: '正常'}, {v: 1.2, d: '1.2×', t: '快'}];
function bindSpeed(row){
  RATES.forEach(r => {
    const b = document.createElement('button'); b.dataset.v = r.v;
    b.textContent = r.d;
    const sm = document.createElement('small'); sm.textContent = r.t; b.appendChild(sm);
    b.onclick = () => { rate = r.v; player.playbackRate = rate; syncSpeed(); };
    row.appendChild(b);
  });
}
function syncSpeed(){ document.querySelectorAll('.speed button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.v) === rate)); }
bindSpeed($('speedRow')); bindSpeed($('speedRowM')); syncSpeed();
function bindAuto(el, other){ el.addEventListener('change', () => { autoRead = el.checked; other.checked = autoRead; }); }
bindAuto($('autoToggle'), $('autoToggleM')); bindAuto($('autoToggleM'), $('autoToggle'));
$('fullBtn').onclick = () => { fullMode ? stopSeq() : startFull(); };
$('fabFull').onclick = () => { fullMode ? stopSeq() : startFull(); };
/* shelf open/close */
$('shelfCloseBtn').onclick = () => { if (window.innerWidth <= 680) document.body.classList.remove('shelf-open'); else document.body.classList.add('shelf-closed'); };
$('shelfOpenBtn').onclick = () => document.body.classList.remove('shelf-closed');
$('fabShelf').onclick = () => document.body.classList.add('shelf-open');
$('drawerBackdrop').onclick = () => document.body.classList.remove('shelf-open');
/* sheet */
$('fabSettings').onclick = () => document.body.classList.add('sheet-open');
$('sheetClose').onclick = () => document.body.classList.remove('sheet-open');
$('sheetBackdrop').onclick = () => document.body.classList.remove('sheet-open');
/* swipe + keys */
let tx = null;
$('imgWrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive: true});
$('imgWrap').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 42) { stopSeq(); gotoPage(page + (dx < 0 ? 1 : -1), {read: true}); } }, {passive: true});
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { stopSeq(); gotoPage(page + 1, {read: true}); } if (e.key === 'ArrowLeft') { stopSeq(); gotoPage(page - 1, {read: true}); } });

/* ---- boot ---- */
fetch('books/manifest.json').then(r => r.json()).then(m => {
  LIB = m;
  renderShelf();
  selectBook(0);
}).catch(() => {});
</script>
</body>
</html>
